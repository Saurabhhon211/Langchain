[project]
name = "langchain-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langsmith>=0.14.12",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-search-agent = "langchain_search_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
